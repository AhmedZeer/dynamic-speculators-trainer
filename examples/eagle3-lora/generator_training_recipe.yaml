# Model, activation, and generated-adapter recipe; no saved LoRA inputs.
models:
  target: Qwen/Qwen3-8B
  target_revision: main
  drafter: RedHatAI/Qwen3-8B-speculator.eagle3
  drafter_revision: main
dataset:
  source: openeurollm/Nemotron-Post-Training-Dataset-v2-decontaminated
  revision: main
  configuration: default
  split: math
  category: math
  sample_limit: null
hidden_states:
  layer_ids:
  - 2
  - 18
  - 33
  - 36
  dtype: bfloat16
  sequence_length: 8192
lora:
  rank: 32
  alpha: 64
  dropout: 0.05
  target_modules:
  - o_proj
  - v_proj
training:
  token_budget: 8192
  noise_std: 0.05
  ttt_steps: 3
  ttt_step_loss_decay: 1.0
  gradient_checkpointing: false
execution:
  draft_attn_impl: simple_flex_attention
  n_workers: 1
conditioning:
  max_examples: 8
  states: prompt
hub:
  mode: consumer
  trajectories_repo: azeeer/eagle3-qwen3-8b-trajectories-v1
  trajectories_revision: 058f01d1f0585e98327b2c190a65c796da04fdd4
  release: r0001
