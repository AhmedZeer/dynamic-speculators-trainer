# Original 4K/1,500-update pipeline; fresh attention generator, frozen DeepSpec drafter.
training_recipe: training_recipe.yaml
input_root: output/deepseek-ttt7-generator-v1/inputs
output_root: /content/drive/MyDrive/dyn-spec-deepseek-ttt7-generator-v1
staging_dir: /tmp/speculators-deepseek-ttt7-generator-v1
condition: last
seed: 42
device: cuda
dtype: bfloat16
generator_dtype: bfloat16
generator_batching: true
n_workers: 1
heatmap_n_workers: 1
activation_prefetch_workers: 2
preprocessing_workers: 4
factor_cache_mib: 256
context:
  min_examples: 1
  max_examples: 8
  evaluation_sizes:
  - 4
optimization:
  loss_fn: lk_hybrid
  lr: 0.0001
  weight_decay: 0.01
  max_grad_norm: 0.85
  warmup_updates: 100
  pretraining_updates: 1500
  pretraining_validation_interval: 250
  episodes_per_update: 4
  checkpoint_interval: 500
  log_interval: 10
  token_budget: 8192
adaptation_updates: 1000
hub_upload_interval: 500
pilot:
  updates: 100
wandb:
  enabled: true
  mode: online
  pretraining_project: eagle3-generator-ablations-v3
  layout: sections
  projects:
    conditioning: eagle3-generator-conditioning
    heatmap: eagle3-generator-heatmap
    adaptation: eagle3-generator-adaptation
  name_prefix: deepseek-ttt7-generator-v1-
activation_source: vllm
trajectories_path: ./trajectories
online:
  ram_cache_gib: 120
  summary_cache_dir: output/generator-summary-cache
  compiler_cache_dir: output/generator-compiler-cache
  lookahead_updates: 2
  endpoint: http://127.0.0.1:8000/v1
  shared_dir: /tmp/speculators-deepseek-ttt7-online
  concurrency: 128
  buffered_examples: 256
  target_model_path: models/qwen3-8b
  drafter_model_path: output/deepseek-eagle3-ttt7-training/f6485ba8d21e11942958617dbe7e71b467f38f38
  reserve_gib: 8
provenance_dir: output/deepseek-ttt7-generator-v1/provenance/vllm
target_modules:
- q_proj
- k_proj
- v_proj
- o_proj
architecture:
  encoder_hidden: 512
  example_dim: 128
  condition_dim: 64
  descriptor_dim: 32
  decoder_width: 512
  residual_blocks: 2
name: deepseek-ttt7-attention-4k-1500
family: modules
repo_id: azeeer/eagle3-generator-deepseek-ttt7-attention-4k-1500
trajectory_recipe: ../generator_training_recipe.yaml
