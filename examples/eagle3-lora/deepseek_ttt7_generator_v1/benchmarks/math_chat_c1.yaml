# Trained generator only; require the completed step-1500 HF snapshot.
# Math/chat C1 settings match the measured DeepSeek drafter baseline.
models:
- name: generator-deepseek-ttt7-attention-4k-1500
  type: generator
  model: azeeer/eagle3-generator-deepseek-ttt7-attention-4k-1500
  revision: main
  subfolder: step-00001500
  adapter_policy: shared
  conditioning_examples: 1
