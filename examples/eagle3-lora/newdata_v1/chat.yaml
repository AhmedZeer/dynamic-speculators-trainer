# New decontaminated prompts folded into 4 categories (scripts/newdata_v1).
# 6 subsets x (1,000 train + 100 validation) per category = 24K train.
# Nested 4K = subset 0. A 100K release extends this one as its parent.
# Generation settings match the Nemotron trajectories (thinking off, T=0.7).
output_root: out/data/eagle3/newdata-v1-24k/chat
models:
  target: Qwen/Qwen3-8B
  target_revision: b968826d9c46dd6066d109eabc6255188de91218
  drafter: RedHatAI/Qwen3-8B-speculator.eagle3
  drafter_revision: 08610ffa01dd9f16731fe8f627b85905b6aa51c4
dataset:
  source: azeeer/dyn-spec-eagle3-newdata-source-v1
  revision: main
  configuration: default
  split: chat
  category: chat
  sample_limit: null
partition:
  train_examples: 1000
  validation_examples: 100
  seed: 0
  subset_ids:
  - 0
  - 1
  - 2
  - 3
  - 4
  - 5
responses:
  thinking: false
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  seed: 0
  max_tokens: 4096
  context_length: 8192
hidden_states:
  layer_ids:
  - 2
  - 18
  - 33
  - 36
  dtype: bfloat16
  sequence_length: 8192
lora:
  rank: 32
  alpha: 64
  dropout: 0.05
  target_modules:
  - o_proj
  - v_proj
training:
  seeds:
  - 42
  warmup_epochs: 1
  collect_epochs: 4
  warmup_lr: 0.0001
  collect_lr: 1.0e-06
  loras_per_epoch: 10
  weight_decay: 0.01
  token_budget: 8192
  noise_std: 0.05
  ttt_steps: 3
  ttt_step_loss_decay: 1.0
  loss_fn: kl_div
  log_freq: 10
  gradient_checkpointing: false
execution:
  dataloader_workers: 4
  dataloader_prefetch_factor: 2
  activation_memory_cache_gib: 1
  prefetch_next_subset: true
  generation_endpoint: http://localhost:8000/v1/chat/completions
  extraction_endpoint: http://localhost:8000/v1
  concurrency: 256
  hidden_state_concurrency: 128
  hidden_state_write_concurrency: 2
  hidden_state_log_interval: 10
  prompt_chunk_size: 1000
  response_staging_dir: null
  response_sync_interval: 1000
  request_timeout: 600
  max_retries: 3
  n_workers: 1
  processes: 1
  draft_attn_impl: simple_flex_attention
conditioning:
  max_examples: 8
  states: prompt
hub:
  mode: producer
  private: true
  trajectories_repo: azeeer/eagle3-qwen3-8b-trajectories-newdata-v1
  activations_repo: azeeer/eagle3-qwen3-8b-activations-newdata-v1
  selection: s0002
  release: r0002-24k
  selection_root: out/data/eagle3/newdata-v1-24k/selection
  domains:
  - chat
  - math
  - code
  - stem
  adaptation_subset_ids:
  - 5
  response_chunk_size: 1000
  extraction_scope: subset
  activation_format: raw
  upload_max_files: 128
  upload_batch_examples: 512
  upload_batch_bytes: 8589934592
  shard_bytes: 1073741824
  cache_gib: 40
  cache_reserve_gib: 8
