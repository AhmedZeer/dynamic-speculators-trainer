# Run after all three snapshots are uploaded; exact step subfolders are required.
models:
- name: generator-attention-24k-step2000
  type: generator
  model: azeeer/eagle3-generator-attention-24k-6k-v1
  revision: main
  subfolder: step-00002000
  adapter_policy: shared
  conditioning_examples: 1
- name: generator-attention-24k-step4000
  type: generator
  model: azeeer/eagle3-generator-attention-24k-6k-v1
  revision: main
  subfolder: step-00004000
  adapter_policy: shared
  conditioning_examples: 1
- name: generator-attention-24k-step6000
  type: generator
  model: azeeer/eagle3-generator-attention-24k-6k-v1
  revision: main
