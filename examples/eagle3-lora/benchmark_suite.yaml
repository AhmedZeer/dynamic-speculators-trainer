models:
  - name: eagle3-base
    type: drafter
    model: RedHatAI/Qwen3-8B-speculator.eagle3
    revision: 08610ffa01dd9f16731fe8f627b85905b6aa51c4

  - name: trained-lora
    type: lora
    model: azeeer/eagle3-lora-matched-4k-v1

  - name: generator-24k-2000step
    type: generator
    model: azeeer/eagle3-generator-all24k-10ep-v1
    subfolder: epoch-0002

  - name: generator-4000step
    type: generator
    model: azeeer/eagle3-generator-all24k-10ep-v1
    subfolder: step-00004000

benchmarks:
  - dataset: nemotron
    categories: [math, code, stem, chat]
  - dataset: RedHatAI/speculator_benchmarks
    categories: [HumanEval, math_reasoning, summarization]

# Sweep closed-batch concurrency; use concurrency: 1 for a serial-only suite.
settings:
  max_samples: 50
  max_tokens: 256
  seed: 42
  warmups: 3
  concurrencies: [1, 2, 4, 8]
  batch_wait_ms: 50
  gpu: 0
