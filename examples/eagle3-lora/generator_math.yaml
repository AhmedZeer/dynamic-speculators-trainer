# Run from the repository root. The bank reference is relative to this YAML.
bank_config: bank_math.yaml
output_root: /content/drive/MyDrive/dynamic-speculators-v3/output/generator-math
staging_dir: /tmp/speculators-generator
conditioning_subset: math-00001
bank_subset: math-00000
transfer_seed: 42
seed: 42
n_workers: 1  # Each worker owns a full generator, drafter, and optimizer.
device: cuda
dtype: bfloat16
factor_cache_mib: 256
wandb:
  enabled: true
  mode: online  # Set online to send metrics to your W&B account.
  entity: null
  group: null  # Uses the output directory name.
  name_prefix: ""
  log_interval: 1  # Optimizer updates; independent of console log_interval.
  upload_artifacts: false  # Opt in to uploading results, plots, and provenance.
  projects:
    conditioning: eagle3-generator-conditioning
    heatmap: eagle3-generator-heatmap
    adaptation: eagle3-generator-adaptation
context:
  min_examples: 1
  max_examples: 8
  evaluation_sizes: [1, 4, 8]
architecture:
  encoder_hidden: 512
  example_dim: 128
  condition_dim: 64
  descriptor_dim: 32
  decoder_width: 512
  residual_blocks: 2
optimization:
  lr: 0.0001
  weight_decay: 0.01
  conditioning_epochs: 5
  pretraining_updates: 1000
  episodes_per_update: 4
  adaptation_epochs: 1
  checkpoint_interval: 100
  log_interval: 10
  token_budget: 8192
heatmap:
  strides: [10, 20, 30]
  seed_groups: [[42], [43], [44], [42, 44], [43, 42], [42, 43, 44]]
