# Four separately trained 1000-step generators; match serving conditioning size to training K.
# All five models share the same 24K loss cohorts and are benchmarked at fixed B=8, ID only.
models:
- name: static-lora-24k-1k
  type: lora
  model: azeeer/eagle3-lora-all24k-1k-v1
  subfolder: step-00001000
- name: generator-24k-1k-k1
  type: generator
  model: azeeer/eagle3-generator-all24k-k1-1k-v1
  subfolder: step-00001000
  conditioning_examples: 1
- name: generator-24k-1k-k2
  type: generator
  model: azeeer/eagle3-generator-all24k-k2-1k-v1
  subfolder: step-00001000
  conditioning_examples: 2
- name: generator-24k-1k-k4
  type: generator
  model: azeeer/eagle3-generator-all24k-k4-1k-v1
  subfolder: step-00001000
  conditioning_examples: 4
- name: generator-24k-1k-k8
  type: generator
  model: azeeer/eagle3-generator-all24k-k8-1k-v1
  subfolder: step-00001000
  conditioning_examples: 8
benchmarks:
- dataset: nemotron
  categories:
  - math
  - code
  - stem
  - chat
settings:
  campaign_config: generator_conditioning_24k_1k_k8.yaml
  max_samples: 64
  max_tokens: 256
  seed: 42
  warmups: 3
  concurrencies:
  - 8
  batch_wait_ms: 50
  gpu: 0
