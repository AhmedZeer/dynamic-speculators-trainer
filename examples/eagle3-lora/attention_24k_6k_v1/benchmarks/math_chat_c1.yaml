  batching_policy: fixed_shared_adapter
  concurrency: 1
  max_samples: 50
  max_tokens: 256
  speculative_tokens: 3
  warmups: 3
  seed: 42
  gpu: 0
  continue_on_error: false
wandb:
  enabled: true
  project: eagle3-generator-structure-bench-v1
  group: attention-24k-6k-v1-math-chat-c1
  mode: online
